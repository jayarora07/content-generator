<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Brand OS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <div class="header-row">
        <h1>Personal Brand OS</h1>
        <button id="btn-home" class="ghost">🏠 Home</button>
      </div>
      <p class="sub">Private &amp; local — nothing is shared, nothing auto-publishes.</p>
    </header>

    <!-- GENERATE -->
    <section id="generate">
      <button id="btn-ideas" class="big">✨ Get content ideas</button>

      <div id="progress" class="hidden">
        <div class="spinner"></div>
        <div id="progress-log"></div>
        <p class="hint">Research usually takes 1–3 minutes. Keep this tab open.</p>
      </div>

      <div id="error-box" class="hidden"></div>

      <div id="ideas" class="hidden">
        <h2>Pick an idea</h2>
        <div id="idea-cards"></div>
      </div>

      <div id="results" class="hidden">
        <h2 id="result-topic"></h2>
        <div id="result-blocks"></div>
        <div class="row">
          <button id="btn-back-ideas" class="ghost">← Back to ideas</button>
          <button id="btn-restart" class="ghost">Start over</button>
        </div>
      </div>
    </section>

    <!-- HISTORY -->
    <section id="history-section">
      <h2>Your posts</h2>
      <div id="history-list"><p class="hint">Nothing yet — generate your first post above.</p></div>
    </section>

    <!-- SETTINGS -->
    <section id="settings-section">
      <button id="btn-settings-toggle" class="ghost">⚙️ Settings</button>
      <div id="settings-body" class="hidden">
        <p class="hint">These are the brand rules given to the AI on every generation. Edit freely.</p>
        <textarea id="brand-rules" rows="16"></textarea>
        <div class="row">
          <button id="btn-save-settings">Save</button>
          <button id="btn-reset-settings" class="ghost">Reset to default</button>
        </div>
        <p id="settings-status" class="hint"></p>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
